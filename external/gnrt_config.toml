# Project-specific settings for collecting Cargo declarations, resolving
# dependencies, and generating GN rules. Paths in [collect] and [resolve] are
# relative to the project root; paths in [gn] are relative to this file.

[collect]
declaration_files = ["external/rust/BUILD.gn"]

[resolve]
# Legacy gen/vendor root; required by the shared schema but unused by sync.
root = "bluekernel_crates_io"
cargo_lockfile = "external/rust/Cargo.lock"
toolchain_file = "build/toolchain/BUILD.gn"
# Crates removed from the generated GN dependency graph.
remove_crates = [
    # C/C++ dependencies must be explicitly writting in GN rules somehow.
    'cc',
    'link-cplusplus',
    'shlex',
    # minimal-lexical is unsound see https://crrev.com/c/4977110 for more info.
    # It is a dependency of nom, but not actually used.
    'minimal-lexical',
    # Windows targets that we do not ever target.
    'windows_aarch64_gnullvm',
    'windows_i686_gnu',
    'windows_i686_gnullvm',
    'windows_x86_64_gnu',
    'windows_x86_64_gnullvm',
    # Behind a feature that we do not enable.
    'wasi'
]

[fingerprint]
# Changes to these inputs invalidate the recorded sync result.
tools = ["rustc", "python3"]
environment = ["RUSTUP_TOOLCHAIN", "RUSTC_BOOTSTRAP", "RUSTFLAGS", "CARGO_HOME"]

[gn]
build_file_template = "../build/CARGO_BUILD.gn.hbs"
readme_file_template = "README.blueos.hbs"

[crate.defmt]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.defmt-parser]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]
patches = ["//external/rust/patches/defmt-parser-1.0.0/001-disable-thiserror-default-features.patch"]

[crate.defmt-macros]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.delegate]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.siphasher]
license_files = ["README.md"]

[crate.tock-registers]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.void]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.managed]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.gd32e5]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.bare-metal]
license_files = ["LICENSE-APACHE", "LICENSE-MIT"]

[crate.smoltcp]
license_files = ["LICENSE-0BSD.txt"]
build_script_outputs = [ "config.rs" ]

[crate.thiserror]
build_script_outputs = [ "private.rs" ]

[crate.num-traits]
# Use total_cmp directly and remove the autocfg build probe.
remove_deps = ["autocfg"]

[crate.defmt-rtt]
license_files = ["../../LICENSE-MIT"]
build_script_outputs = [ "consts.rs" ]

[crate.cortex-m-rt-macros]
license_files = ["../../LICENSE-MIT"]
build_script_outputs = [ "link.x" ]

[crate.cortex-m-rt]
license_files = ["../LICENSE-MIT"]
build_script_outputs = [ "link.x" ]

[crate.defmt-test-macros]
license_files = ["../../../LICENSE-MIT"]

[crate.defmt-test]
license_files = ["../../LICENSE-MIT"]

[crate.cortex-m-semihosting]
license_files = ["LICENSE-MIT"]

[crate.esp-radio-rtos-driver]
license_files = ["LICENSE-MIT"]

[crate.esp-wifi-sys-esp32c3]
license_files = ["LICENSE-MIT"]
patches = ["//external/rust/patches/esp-wifi-sys-esp32c3-0.2.0/001-link-core-after-wifi.patch"]

# C6 WiFi driver FFI crate; license files match C3 (MIT).
[crate.esp-wifi-sys-esp32c6]
license_files = ["LICENSE-MIT"]
patches = [
    "//external/rust/patches/esp-wifi-sys-esp32c6-0.2.0/001-link-native-libm.patch",
    "//external/rust/patches/esp-wifi-sys-esp32c6-0.2.0/002-link-core-after-wifi.patch",
]

[crate.esp-metadata-generated]
license_files = ["LICENSE-MIT"]

[crate.esp-sync]
license_files = ["LICENSE-MIT"]

[crate.embassy-sync]
license_files = ["LICENSE-MIT"]

[crate.riscv]
license_files = ["LICENSE-MIT"]

[crate.riscv-macros]
license_files = ["LICENSE-MIT"]

[crate.riscv-pac]
license_files = ["LICENSE-MIT"]

[crate.bitfield-macros]
license_files = ["LICENSE-MIT"]

[crate.embassy-futures]
license_files = ["LICENSE-MIT"]

[crate.esp-config]
license_files = ["LICENSE-MIT"]

[crate.esp-hal]
license_files = ["LICENSE-MIT"]
# Support BlueOS targets and preserve existing source adaptations.
patches = [
    "//external/rust/patches/esp-hal-1.1.1/001-stable-toolchain-compat.patch",
]
# BlueKernel provides its own startup code and trap handlers. Chip features
# pull in esp-riscv-rt even with esp-hal's `rt` feature disabled, so omit this
# unused runtime from the GN build.
remove_deps = ["esp-riscv-rt"]

[crate.esp-hal-procmacros]
license_files = ["LICENSE-MIT"]

[crate.esp-phy]
license_files = ["LICENSE-MIT"]

[crate.esp-rom-sys]
license_files = ["LICENSE-MIT"]

[crate.windows-link]
license_files = ["LICENSE-MIT"]

[crate.windows-sys]
license_files = ["LICENSE-MIT"]

[crate.esp32c3]
license_files = ["LICENSE-MIT", "LICENSE-Apache-2.0"]

# C6 PAC crate; license files match C3 (MIT + Apache-2.0).
[crate.esp32c6]
license_files = ["LICENSE-MIT", "LICENSE-Apache-2.0"]

[crate.xtensa-lx]
license_files = ["LICENSE-MIT"]

[crate.embedded-graphics-core]
license_files = ["README.md"]
